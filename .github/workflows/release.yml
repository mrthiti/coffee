name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build binaries
        run: |
          GOARCH=arm64 go build -ldflags "-X main.version=${{ github.ref_name }}" -o coffee-darwin-arm64 .
          GOARCH=amd64 go build -ldflags "-X main.version=${{ github.ref_name }}" -o coffee-darwin-amd64 .

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            coffee-darwin-arm64
            coffee-darwin-amd64
