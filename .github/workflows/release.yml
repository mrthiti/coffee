name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build binaries
        run: |
          GOARCH=arm64 go build -ldflags "-X main.version=${{ github.ref_name }}" -o coffee-darwin-arm64 .
          GOARCH=amd64 go build -ldflags "-X main.version=${{ github.ref_name }}" -o coffee-darwin-amd64 .

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            coffee-darwin-arm64
            coffee-darwin-amd64

      - name: Update Homebrew Cask
        run: |
          set -eu

          version="${GITHUB_REF_NAME#v}"
          arm_sha256="$(shasum -a 256 coffee-darwin-arm64 | cut -d' ' -f1)"
          intel_sha256="$(shasum -a 256 coffee-darwin-amd64 | cut -d' ' -f1)"

          git fetch --depth=1 origin main
          git checkout -B main origin/main

          sed -i '' "s/^  version \".*\"/  version \"$version\"/" Casks/coffee.rb
          sed -i '' "s/^  arm_sha256   = \".*\"/  arm_sha256   = \"$arm_sha256\"/" Casks/coffee.rb
          sed -i '' "s/^  intel_sha256 = \".*\"/  intel_sha256 = \"$intel_sha256\"/" Casks/coffee.rb

          if git diff --quiet Casks/coffee.rb; then
            echo "Casks/coffee.rb already up to date, nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/coffee.rb
          git commit -m "Update Homebrew Cask to ${GITHUB_REF_NAME}"
          git push origin main
